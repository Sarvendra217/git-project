<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git profile</title>
    <link rel="stylesheet" href="git.css">    
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top-nav">
     <div class="git">
        <h3>Git Profile</h3>
       <img class="git-logo" src="Github-Logo.webp">
     </div>
        
    
    <div class="search">
        <input  id = "search-input" class="search-bar" type="text" placeholder="Search GitHub username...">
    <button id="search-btn" class="search-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
    </header>
    
    <div class="profile-side">
        <div class = "profile">
            <h3>Profile</h3>
        <div class="profile-img">
            <img id="avatar" src="177003112.jpg">
             </div>
         <div class="profile-name">
             <h1 id="full-name">Sarvendra vikram singh</h1>
              </div>
         <div class="profile-id">
              <h4 id="username">Sarvendra217</h4>
          </div>
     <span class="bio-data">
          <h5 id="bio">No bio available</h5>
     </span>

<div class="location">
    <img src="location.webp">
    <h5 id="location">Earth</h5>
</div>
<div class="college">
    <img  src="building.png">
<h5 id="company">............................................</h5>
</div>
</div>
              
         <div class="stats-grid">
        <div class="stat-box">
            <span class="label">REPOS</span>
            <span id="repos" class="value"></span>
        </div>
        <div class="stat-box">
            <span class="label">FOLLOWERS</span>
            <span id="followers" class="value"></span>
        </div>
        <div class="stat-box">
            <span class="label">FOLLOWING</span>
            <span id="following" class="value"></span>
        </div>
        <div class="stat-box">
            <span class="label">GISTS</span>
            <span  id="gists" class="value"></span>
        </div>
    </div>
        

    <div class = "work">
     <h3>Latest work</h3>
 <div id="repos-container">
    
 </div>
    </div>

</div>    
</div>
</body>
</html>
